{"name": "Build APK", "on": ["push", "workflow_dispatch"], "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "subosito/flutter-action@v2", "with": {"channel": "stable"}}, {"name": "Create Android project", "run": "flutter create --platforms=android --project-name wordten --org com.wordten _tmp && cp -r _tmp/android android && rm -rf _tmp"}, {"name": "Patch manifest", "run": "sed -i 's#<application#<uses-permission android:name=\"android.permission.INTERNET\"/><uses-permission android:name=\"android.permission.RECORD_AUDIO\"/><application#' android/app/src/main/AndroidManifest.xml && (grep -q '<queries>' android/app/src/main/AndroidManifest.xml && sed -i 's#<queries>#<queries><intent><action android:name=\"android.speech.RecognitionService\"/></intent>#' android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<queries><intent><action android:name=\"android.speech.RecognitionService\"/></intent></queries><application#' android/app/src/main/AndroidManifest.xml) && sed -i 's#android:label=\"wordten\"#android:label=\"WordTen\"#' android/app/src/main/AndroidManifest.xml"}, {"run": "flutter pub get"}, {"run": "flutter build apk --release"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "WordTen-apk", "path": "build/app/outputs/flutter-apk/app-release.apk"}}]}}}
